# MONITORS
monitor=,preferred,auto

# AUTOSTART
source = ~/.config/hypr/autostart.conf

# INPUT
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# GENERAL
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(1a1b26aa)
    layout = dwindle
    resize_on_border = true
}

# DECORATION
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }
    drop_shadow = true
    shadow_range = 15
    shadow_render_power = 2
    dim_inactive = false
    dim_strength = 0.05
}

# ANIMATIONS
animations {
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 10, ease
    animation = borderangle, 1, 8, ease
    animation = fade, 1, 7, smoothIn
    animation = workspaces, 1, 6, default
}

# LAYOUT
dwindle {
    pseudotile = true
    preserve_split = true
    no_gaps_when_only = false
}

master {
    new_is_master = false
}

# GESTURES
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# MISC
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# WINDOW RULES
windowrulev2 = workspace 1, class:^(vscodium|code-oss|Code)$
windowrulev2 = workspace 2, class:^(Brave-browser|brave)$
windowrulev2 = workspace 3, class:^(Firefox|firefox)$
windowrulev2 = workspace special:chat, class:^(discord|Discord)$
windowrulev2 = workspace special:music, class:^(Spotify|spotify)$
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor)$
windowrulev2 = size 800 600, class:^(pavucontrol)$

# SPECIAL WORKSPACES
bindl = , Print, exec, grim -g "$(slurp)" - | wl-copy
bindl = , Print, exec, grim - | wl-copy

# KEYBINDINGS
$mainMod = SUPER

bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod, Q, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, exec, code
bind = $mainMod, T, exec, twitch

# Toggle Special Workspaces
bind = $mainMod, D, togglespecialworkspace, chat
bind = $mainMod, M, togglespecialworkspace, music
bind = $mainMod, S, togglespecialworkspace, magic

# Workspace Switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshots/$(date +%Y%m%d%H%M%S).png

# Lock screen
bind = $mainMod SHIFT, L, exec, hyprlock

# Reload Hyprland
bind = $mainMod CTRL SHIFT, R, exec, hyprctl reload

# Media keys
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
